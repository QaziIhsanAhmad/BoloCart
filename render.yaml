services:
  - type: web
    name: bolocart
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: "7860"
      - key: DB_PATH
        value: /tmp/agent.db
      - key: SEND_MODE
        value: test
      - key: LIVE_APPROVED
        value: "no"
      - key: STORE_NAME
        value: Demo Store
      - key: KB_PATH
        value: kb/demo.md
      - key: OLLAMA_URL
        value: http://127.0.0.1:9

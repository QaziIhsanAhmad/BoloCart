name: BoloCart test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bolocart
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m demo.run_demo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker end-to-end test (local D1, mock WhatsApp API)
        working-directory: worker
        run: npm ci --silent && ./test/run.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --silent
        working-directory: worker
      - name: Deploy to Cloudflare Workers (free)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          TEST_RECIPIENTS: ${{ secrets.TEST_RECIPIENTS }}
        run: ./deploy/cf_deploy.sh
      - name: Verify from outside
        if: env.skip != '1'
        env:
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
        run: python deploy/verify.py
      - name: Connect WhatsApp test number
        if: env.skip != '1'
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_APP_ID: ${{ secrets.WA_APP_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
        run: python deploy/meta_setup.py
      - name: Save status
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add deploy/status
          git diff --cached --quiet && exit 0
          git checkout -- worker/wrangler.toml 2>/dev/null || true
          git commit -m "Deploy status $(date -u +%FT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q && break; sleep 5; done

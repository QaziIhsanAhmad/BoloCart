name: BoloCart test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy or check"
        default: deploy

permissions:
  contents: write

concurrency:
  group: bolocart
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m demo.run_demo

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to Render (free) and verify
        env:
          MODE: ${{ inputs.mode || 'deploy' }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          TEST_RECIPIENTS: ${{ secrets.TEST_RECIPIENTS }}
        run: python deploy/deploy.py
      - name: Connect WhatsApp test number
        env:
          WA_APP_ID: ${{ secrets.WA_APP_ID }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
        run: python deploy/meta_setup.py
      - name: Save status
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add deploy/status
          git diff --cached --quiet && exit 0
          git commit -m "Deploy status $(date -u +%FT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done

services:
  agent:
    build: .
    env_file: .env
    environment:
      DB_PATH: /home/user/app/data/agent.db
    volumes:
      - ./data:/home/user/app/data
      - ./kb:/home/user/app/kb
    restart: unless-stopped
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Free ngrok account (no card) gives one static domain -> stable webhook URL
  tunnel:
    image: ngrok/ngrok:latest
    command: ["http", "--url=${NGROK_DOMAIN}", "agent:7860"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    restart: unless-stopped
    depends_on: [agent]
